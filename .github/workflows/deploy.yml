name: Deploy to production

on:
  push:
    branches: [main]

# Let an in-progress deploy finish; the newest queued merge deploys next.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-and-test

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting and security rules
        run: npx firebase deploy --only hosting,firestore,storage --project "$PROJECT_ID" --non-interactive
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
